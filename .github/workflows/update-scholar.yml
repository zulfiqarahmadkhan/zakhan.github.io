name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 3 * * *"     # every day at 03:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scholarly
        run: pip install scholarly "bibtexparser<2"   # scholarly breaks with bibtexparser 2.x

      - name: Fetch metrics from Google Scholar
        env:
          SCHOLAR_ID: TmDD6z8AAAAJ
          # Set to "1" if Google Scholar starts blocking GitHub's servers
          USE_FREE_PROXIES: "0"
        run: python scripts/update_scholar.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet data/scholar.json; then
            echo "No changes."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/scholar.json
            git commit -m "Update Google Scholar metrics"
            git push
          fi
